app = "fitness-tracker-pwa-hastingsji"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  RATE_LIMIT_PER_MINUTE = "60"
  ALLOWED_ORIGINS = "https://fitness-tracker-pwa-hastingsji.fly.dev,https://hastingsji.github.io"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
